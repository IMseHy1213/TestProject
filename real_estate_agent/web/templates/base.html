<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}토지 매물 추천{% endblock %} · Real Estate Recommendation Agent</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5f4a'/%3E%3Cpath d='M6 22l7-9 5 6 3-4 5 7z' fill='%23f3efe4'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>토지 매물 추천<small>Real Estate Recommendation Agent</small></span>
    </a>
    <nav>
      <a href="{{ url_for('agent_page') }}">AI 상담</a>
      {% if is_admin %}
        <a href="{{ url_for('admin') }}">관리자</a>
        <form method="post" action="{{ url_for('admin_logout') }}" class="inline">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button class="link">로그아웃</button>
        </form>
      {% else %}
        <a href="{{ url_for('admin') }}" class="muted">관리자</a>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">매물 정보는 중개사무소 보유 자료 기준이며, 정확한 지번·연락처는 상담 시 안내해 드립니다.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
